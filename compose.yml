services:
    db:
        image: postgres:15
        ports:
        - "5500:5432"
        env_file:
            - .env

        volumes:
            - pgdata:/var/lib/postgresql/data
    loopy:
        build:
            context: ./backend
            dockerfile: Dockerfile
        env_file:
            -   .env
        ports:
            - "8080:8080"
        depends_on:
            -   db
volumes:
    pgdata:
